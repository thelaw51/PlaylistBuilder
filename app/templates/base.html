<!DOCTYPE html>
<html lang="en" style="background:#0b0b0b">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PlaylistBuilder{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-[#0b0b0b] text-[#c8c8c8]"
      style="font-family:'IBM Plex Mono',ui-monospace,monospace">

  <nav class="border-b border-[#1c1c1c]">
    <div class="mx-auto max-w-4xl flex items-center gap-8 px-6 py-3">
      <a href="/"
         class="text-xs font-semibold uppercase tracking-[0.14em] text-[#ebebeb] no-underline hover:text-white transition-colors">
        PlaylistBuilder
      </a>
      <a href="/jobs" class="text-xs text-[#4a4a4a] hover:text-[#999] transition-colors">
        jobs
      </a>
    </div>
  </nav>

  <main class="mx-auto max-w-4xl px-6 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="mb-5 px-4 py-2.5 text-xs border
          {% if category == 'error' %}border-[#3d1515] bg-[rgba(127,29,29,0.12)] text-red-400
          {% else %}border-[#143d14] bg-[rgba(20,83,45,0.12)] text-green-400{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
