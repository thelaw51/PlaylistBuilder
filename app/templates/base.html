<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PlaylistBuilder{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="h-full text-gray-100">

  <nav class="border-b border-gray-800 bg-gray-900">
    <div class="mx-auto max-w-5xl flex items-center gap-6 px-4 py-3">
      <a href="/" class="text-lg font-semibold tracking-tight text-white hover:text-indigo-400">PlaylistBuilder</a>
      <a href="/jobs" class="text-sm text-gray-400 hover:text-white">Jobs</a>
    </div>
  </nav>

  <main class="mx-auto max-w-5xl px-4 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="mb-4 rounded-lg px-4 py-3 text-sm
          {% if category == 'error' %}bg-red-900/60 text-red-300{% else %}bg-green-900/60 text-green-300{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
