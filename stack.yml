services:
  webapp:
    image: ghcr.io/thelaw51/playlistbuilder:latest
    ports:
      - "8080:5000"
    volumes:
      - playlistbuilder_data:/data
      - playlistbuilder_beets:/config/beets
      - /path/to/your/music:/music # ← change to your host music directory
    environment:
      - NAVIDROME_URL=http://your-navidrome-host:4533
      - NAVIDROME_USER=admin
      - NAVIDROME_PASSWORD=change-me
      - SECRET_KEY=change-me
      - DATABASE_URL=sqlite:////data/playlist_builder.db
      - BEETS_CONFIG=/config/beets/config.yaml
      - DOWNLOAD_DIR=/tmp/pb_downloads
      - JOB_RETENTION_DAYS=30
      # Optional: path to a Netscape cookies file for age-restricted YouTube videos
      # - YT_COOKIES_FILE=/data/youtube-cookies.txt
    restart: unless-stopped

volumes:
  playlistbuilder_data:
  playlistbuilder_beets:
